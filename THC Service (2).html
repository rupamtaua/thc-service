<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THC Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--b:#1553e8;--b2:#0a2a78;--b3:#e8f0ff;--bg:#f4f7ff;--tx:#0d1b3d;--mu:#5b6a8c;--ln:#dfe7f8;--ok:#0e9f6e;--er:#d9364a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.55;-webkit-font-smoothing:antialiased}
svg.i{width:1.25em;height:1.25em;fill:currentColor;fill-opacity:.13;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.nav{max-width:1180px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;cursor:pointer;margin-right:auto;color:var(--b2)}
.logo b{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#2b6bff,#0a2a78);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(21,83,232,.35)}
.logo span em{font-style:normal;color:var(--b)}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,box-shadow .2s,background .2s;background:var(--b3);color:var(--b)}
.btn:hover{transform:translateY(-1px)}
.btn.p{background:linear-gradient(135deg,#2b6bff,#1040c4);color:#fff;box-shadow:0 8px 20px rgba(21,83,232,.3)}
.btn.w{background:#fff;color:var(--b2)}
.btn.d{background:#fdeaed;color:var(--er)}
.btn.s{padding:7px 12px;font-size:.85rem;border-radius:10px}
:focus-visible{outline:3px solid #8fb0ff;outline-offset:2px}
.chip{display:flex;align-items:center;gap:8px;background:var(--b3);color:var(--b2);border-radius:99px;padding:6px 14px 6px 8px;font-weight:600;font-size:.9rem}
.chip i{width:26px;height:26px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;font-style:normal;font-size:.8rem}
main{max-width:1180px;margin:auto;padding:22px 20px 60px}
.slider{position:relative;height:clamp(240px,42vw,400px);border-radius:28px;overflow:hidden;box-shadow:0 24px 50px rgba(10,42,120,.2)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;display:flex;flex-direction:column;justify-content:center;padding:clamp(22px,5vw,64px);color:#fff;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide h1{font-size:clamp(1.6rem,4.5vw,3rem);line-height:1.1;max-width:620px;font-weight:800;letter-spacing:-.02em}
.slide p{max-width:480px;margin:12px 0 22px;opacity:.9;font-size:clamp(.95rem,1.8vw,1.1rem)}
.slide::after{content:"";position:absolute;right:-90px;top:-90px;width:380px;height:380px;border-radius:50%;background:rgba(255,255,255,.08);z-index:-1}
.g0{background:linear-gradient(120deg,#0a2a78,#1553e8)}.g1{background:linear-gradient(120deg,#0f3fb5,#3a8bff)}.g2{background:linear-gradient(120deg,#071a52,#2459d6)}
.dots{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3}
.dots button{width:9px;height:9px;border-radius:99px;border:0;background:rgba(255,255,255,.5);cursor:pointer;transition:width .3s,background .3s;padding:0}
.dots button.on{width:28px;background:#fff}
h2.sec{font-size:1.6rem;font-weight:800;margin:44px 0 4px;letter-spacing:-.01em}
.sub{color:var(--mu);margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--ln);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .25s,transform .25s}
.card:hover{box-shadow:0 18px 40px rgba(21,83,232,.14);transform:translateY(-3px)}
.ic{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#e8f0ff,#cfe0ff);color:var(--b);display:grid;place-items:center;overflow:hidden}
.ic svg.i{width:28px;height:28px}.ic img{width:34px;height:34px;object-fit:contain}
.card h3{font-size:1.1rem}.card p{color:var(--mu);font-size:.93rem;flex:1}
.pr{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.pr strong{font-size:1.25rem;color:var(--b2)}
.empty{padding:40px;text-align:center;color:var(--mu);background:#fff;border:1px dashed var(--ln);border-radius:20px}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--ln);padding:6px;border-radius:16px;overflow-x:auto;margin:6px 0 20px}
.tabs button{border:0;background:none;padding:10px 16px;border-radius:11px;font-weight:600;color:var(--mu);cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tabs button.on{background:var(--b);color:#fff;box-shadow:0 6px 14px rgba(21,83,232,.3)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.bar h3{font-size:1.2rem}
.tbl{background:#fff;border:1px solid var(--ln);border-radius:18px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--ln);font-size:.92rem;vertical-align:middle}
th{background:#f8faff;color:var(--mu);font-weight:600;font-size:.82rem}
tr:last-child td{border:0}
td .acts{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:84px;height:44px;border-radius:10px;background-size:cover;background-position:center}
.badge{padding:4px 11px;border-radius:99px;font-size:.78rem;font-weight:700;background:#fff4dc;color:#a76a00}
.badge.Approved{background:#dff5ea;color:var(--ok)}.badge.Completed{background:var(--b3);color:var(--b)}.badge.Cancelled{background:#fdeaed;color:var(--er)}
.ov{position:fixed;inset:0;background:rgba(8,20,60,.55);backdrop-filter:blur(5px);display:grid;place-items:center;padding:18px;z-index:50;overflow:auto}
.ov[hidden]{display:none}
.box{background:#fff;border-radius:26px;padding:28px;width:100%;max-width:440px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
.box.lg{max-width:560px}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}
.box h3{font-size:1.35rem;margin-bottom:4px}.box .m{color:var(--mu);font-size:.92rem;margin-bottom:18px}
label{display:block;font-weight:600;font-size:.85rem;margin:12px 0 6px}
input:not([type=radio]):not([type=file]),select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--ln);border-radius:12px;background:#fafcff;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--b);box-shadow:0 0 0 4px rgba(21,83,232,.12)}
.row{display:flex;gap:10px;margin-top:20px}.row .btn{flex:1;justify-content:center}
.picks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.picks label{margin:0;cursor:pointer}.picks input{position:absolute;opacity:0}
.picks span{display:grid;place-items:center;aspect-ratio:1;border:1.5px solid var(--ln);border-radius:12px;color:var(--mu);transition:.15s}
.picks input:checked+span{background:var(--b);color:#fff;border-color:var(--b)}
.picks input:focus-visible+span{outline:3px solid #8fb0ff}
.sw{display:flex;background:var(--b3);border-radius:14px;padding:4px;margin-bottom:16px}
.sw button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:600;color:var(--mu);cursor:pointer}
.sw button.on{background:#fff;color:var(--b);box-shadow:0 2px 8px rgba(21,83,232,.15)}
.err{color:var(--er);font-size:.86rem;margin-top:10px;min-height:1em}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,30px);background:var(--b2);color:#fff;padding:12px 20px;border-radius:14px;opacity:0;transition:.3s;z-index:90;pointer-events:none;font-weight:600}
#toast.on{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--mu);font-size:.85rem;padding:20px}
body{background:radial-gradient(900px 420px at 90% -5%,#d6e5ff,transparent 70%),radial-gradient(700px 360px at -10% 20%,#e6eeff,transparent 70%),var(--bg);background-attachment:fixed}
.ic{box-shadow:inset 0 0 0 1px #fff,0 10px 22px rgba(21,83,232,.18);background:linear-gradient(145deg,#f1f6ff,#c9dcff)}
.card{position:relative;overflow:hidden}.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,#2b6bff,#8cb8ff);opacity:0;transition:.25s}.card:hover::before{opacity:1}
.slide h1{text-shadow:0 2px 18px rgba(0,0,0,.18)}
#bnav{display:none;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;background:rgba(255,255,255,.93);backdrop-filter:blur(16px);border:1px solid var(--ln);border-radius:26px;padding:6px;gap:4px;box-shadow:0 16px 40px rgba(10,42,120,.24)}
#bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;border-radius:20px;color:var(--mu);font-size:.68rem;font-weight:700;cursor:pointer;transition:.2s}
#bnav svg.i{width:24px;height:24px}
#bnav button.on{color:#fff;background:linear-gradient(135deg,#2b6bff,#1040c4);box-shadow:0 8px 18px rgba(21,83,232,.38)}
@keyframes sheet{from{transform:translateY(50px);opacity:0}}
@media(max-width:720px){
.nav>.btn{display:none}.nav{padding:10px 16px}.hide{display:none}
main{padding:14px 14px calc(100px + env(safe-area-inset-bottom,0px))}
footer{display:none}
.slider{border-radius:22px}.grid{grid-template-columns:1fr 1fr;gap:12px}
.card{padding:16px;border-radius:20px}.card h3{font-size:1rem}.card p{font-size:.85rem}.ic{width:50px;height:50px;border-radius:15px}
.pr{flex-direction:column;align-items:flex-start;gap:10px}.pr .btn{width:100%;justify-content:center}
#bnav{display:flex}
.ov{place-items:end center;padding:0}
.box,.box.lg{max-width:none;border-radius:28px 28px 0 0;max-height:92vh;overflow:auto;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));animation:sheet .3s ease}
input,select,textarea{font-size:16px}
#toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
.hi{margin:2px 2px 14px}.hi small{color:var(--mu);font-weight:600}.hi h1{font-size:1.65rem;letter-spacing:-.02em;line-height:1.2}
.srch{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--ln);border-radius:18px;padding:0 16px;margin-bottom:16px;box-shadow:0 8px 24px rgba(21,83,232,.08);color:var(--b)}
.srch input{border:0!important;background:none!important;box-shadow:none!important;padding:15px 0!important;color:var(--tx)}
.srch:focus-within{border-color:var(--b);box-shadow:0 0 0 4px rgba(21,83,232,.12)}
.trust{display:flex;gap:10px;overflow-x:auto;margin-top:16px;padding-bottom:4px;scrollbar-width:none}.trust::-webkit-scrollbar{display:none}
.trust div{flex:none;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--ln);padding:10px 14px;border-radius:99px;font-size:.85rem;font-weight:600;color:var(--b2)}
.last{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#0a2a78,#1553e8);color:#fff;border-radius:22px;padding:16px 18px;margin-top:14px;box-shadow:0 14px 30px rgba(10,42,120,.25)}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:26px 2px 12px}.sh h2{font-size:1.2rem;font-weight:800;letter-spacing:-.01em}.sh span{color:var(--mu);font-size:.85rem}
.qg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.qt{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-size:.78rem;font-weight:600;text-align:center;line-height:1.25;padding:4px;color:var(--tx)}
.qt .ic{width:100%;max-width:70px;height:auto;aspect-ratio:1;border-radius:22px;transition:transform .15s}.qt:active .ic{transform:scale(.92)}
.qt .ic svg.i{width:30px;height:30px}
.rl{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.rc{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--ln);border-radius:22px;padding:14px;transition:box-shadow .2s}
.rc:hover{box-shadow:0 14px 32px rgba(21,83,232,.12)}
.rc .ic{width:54px;height:54px;border-radius:17px;flex:none}
.rc .t{flex:1;min-width:0}.rc h3{font-size:1rem}.rc p{color:var(--mu);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .a{text-align:right}.rc strong{display:block;color:var(--b2);font-size:1.05rem;margin-bottom:6px}
html,body{max-width:100%;overflow-x:clip}main,.slider,.trust,.last,.srch{max-width:100%;min-width:0}.rc{min-width:0}.rc .a{flex:none}
@media(min-width:721px){.rl{grid-template-columns:repeat(2,minmax(0,1fr))}.qg{grid-template-columns:repeat(8,minmax(0,1fr))}}
@media(max-width:720px){.slider{height:clamp(170px,46vw,300px)}.slide{padding:20px 22px}.slide h1{font-size:1.4rem}.slide p{font-size:.85rem;margin:6px 0 14px}.slide .btn{padding:8px 14px;font-size:.85rem}.dots{bottom:10px}.hi h1{font-size:1.45rem}.rc{padding:12px;gap:12px}.rc .btn{padding:8px 16px}}
@media(max-width:560px){.picks{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="nav" id="nav"></div></header>
<main id="app"></main>
<footer>© THC Service. All rights reserved.</footer>
<div class="ov" id="modal" hidden><div class="box" id="box"></div></div>
<div id="toast"></div>
<nav id="bnav" aria-label="Main navigation"></nav>
<script>
const $=s=>document.querySelector(s);
const mem={};
const store={get(k,d){try{const v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}return k in mem?mem[k]:d},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const P={
wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
heart:'<path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/>',
shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/>',
home:'<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/>',
laptop:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 20h20"/>',
scissors:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 8 20 19M8.5 16 20 5"/>',
spark:'<path d="m12 3 2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',
truck:'<path d="M2 7h11v9H2zM13 10h5l3 3v3h-8"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
book:'<path d="M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/>',
phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
camera:'<path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="3.5"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3"/>',
img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 9"/>',
grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
out:'<path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/>',
plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
check:'<path d="m5 12 5 5 9-10"/>'};
const ICONS=['wrench','bolt','heart','shield','home','laptop','scissors','spark','truck','book','phone','camera'];
const ico=(k,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${P[k]||P.spark}</svg>`;
const iconBox=k=>`<div class="ic">${String(k).startsWith('data:')?`<img src="${k}" alt="">`:ico(k)}</div>`;
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const h=async p=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('thc|'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'p:'+p}};
const fileData=(f,max,type)=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL(type,.82))};i.onerror=()=>r('');i.src=fr.result};fr.onerror=()=>r('');fr.readAsDataURL(f)});

let D={users:[],banners:[],services:[],apps:[]};
const S={view:'home',tab:'banners',me:null,pending:null};
let timer,si=0;
const save=k=>store.set('thc_'+k,D[k]);
async function init(){
  for(const k in D)D[k]=store.get('thc_'+k,[]);
  if(!store.get('thc_seeded',0)){
    D.users=[{id:uid(),name:'Administrator',phone:'9999999999',pass:await h('admin123'),role:'admin'}];
    D.banners=[{id:uid(),title:'Trusted help, right at your door',sub:'Book verified professionals for everyday home and health needs.',img:''},{id:uid(),title:'Festive season offers',sub:'Save up to 25% on selected services this month.',img:''},{id:uid(),title:'Fast. Reliable. Affordable.',sub:'Apply in seconds and track your requests anytime.',img:''}];
    D.services=[['wrench','Appliance repair','AC, fridge and washing machine repair by certified technicians.',499],['spark','Deep home cleaning','Full-home cleaning with eco-safe products and trained staff.',1299],['bolt','Electrical works','Wiring, fittings and safety checks done right the first time.',349],['heart','Health checkup','Complete body checkup with sample collection at home.',899],['laptop','Laptop support','Diagnosis, upgrades and software fixes for any brand.',399],['truck','Pickup & delivery','Same-day parcel pickup and delivery within the city.',149]].map(a=>({id:uid(),icon:a[0],name:a[1],desc:a[2],price:a[3]}));
    ['users','banners','services'].forEach(save);store.set('thc_seeded',1);
  }
  const sid=store.get('thc_session',null);S.me=D.users.find(u=>u.id===sid)||null;
  render();
}
function render(){
  const m=S.me;
  $('#nav').innerHTML=`<div class="logo" data-a="home"><b>${ico('shield')}</b><span>THC <em>Service</em></span></div>`+
  (m?`${m.role==='admin'?`<button class="btn" data-a="admin">${ico('cog')}<span class="hide">Admin panel</span></button>`:`<button class="btn" data-a="myreq">${ico('list')}<span class="hide">My requests</span></button>`}<div class="chip"><i>${esc(m.name[0]||'U').toUpperCase()}</i><span class="hide">${esc(m.name)}</span></div><button class="btn" data-a="logout" aria-label="Log out">${ico('out')}</button>`
  :`<button class="btn" data-a="auth" data-id="login">Log in</button><button class="btn p" data-a="auth" data-id="register">Create account</button>`);
  clearInterval(timer);
  $('#app').innerHTML=(S.view==='admin'&&m&&m.role==='admin')?adminView():homeView();
  const it=[{a:'home',i:'home',l:'Home',on:S.view==='home'},{a:'svcs',i:'grid',l:'Services'},m?(m.role==='admin'?{a:'admin',i:'cog',l:'Admin',on:S.view==='admin'}:{a:'myreq',i:'list',l:'Requests'}):{a:'auth',id:'login',i:'key',l:'Log in'},m?{a:'account',i:'user',l:'Account'}:{a:'auth',id:'register',i:'user',l:'Register'}];
  $('#bnav').innerHTML=it.map(x=>`<button class="${x.on?'on':''}" data-a="${x.a}" data-id="${x.id||''}">${ico(x.i)}<span>${x.l}</span></button>`).join('');
  startSlider();
}
function homeView(){
  const sl=D.banners.map((b,i)=>`<div class="slide ${b.img?'':'g'+(i%3)} ${i===0?'on':''}" ${b.img?`style="background:linear-gradient(90deg,rgba(8,30,90,.85),rgba(8,30,90,.2)),url(${b.img}) center/cover"`:''}><h1>${esc(b.title)}</h1><p>${esc(b.sub)}</p><div><a class="btn w" href="#services" onclick="document.getElementById('services').scrollIntoView({behavior:'smooth'});return false">Browse services</a></div></div>`).join('');
  return `${topBar()}<div class="slider">${sl||'<div class="slide g0 on"><h1>Welcome to THC Service</h1></div>'}<div class="dots">${D.banners.length>1?D.banners.map((_,i)=>`<button class="${i?'':'on'}" data-a="slide" data-id="${i}" aria-label="Banner ${i+1}"></button>`).join(''):''}</div></div>
  ${mid()}<div id="services"></div><div id="lists">${lists()}</div>`;
}
function topBar(){const m=S.me;return `<div class="hi"><div><small>${m?'Welcome back':'Welcome to THC Service'}</small><h1>Hello, ${m?esc(m.name.split(' ')[0]):'there'}</h1></div></div><div class="srch">${ico('search')}<input id="q" type="search" placeholder="Search services" aria-label="Search services" value="${esc(S.q||'')}" oninput="S.q=this.value;$('#lists').innerHTML=lists()"></div>`}
function mid(){const m=S.me,a=m&&D.apps.filter(x=>x.uid===m.id).pop();return `<div class="trust"><div>${ico('shield')}Verified experts</div><div>${ico('bolt')}Quick response</div><div>${ico('heart')}Trusted by families</div></div>`+(a?`<div class="last"><div><small style="opacity:.8">Latest request</small><div style="font-weight:700">${esc(a.sname)}</div></div><span class="badge ${a.status}">${a.status}</span></div>`:'')}
function lists(){
  const q=(S.q||'').toLowerCase().trim(),L=D.services.filter(s=>!q||(s.name+' '+s.desc).toLowerCase().includes(q));
  if(!L.length)return '<div class="empty" style="margin-top:18px">No services match your search.</div>';
  return `<div class="sh"><h2>Quick access</h2><span>${L.length} services</span></div><div class="qg">${L.slice(0,8).map(s=>`<button class="qt" data-a="apply" data-id="${s.id}">${iconBox(s.icon)}<span>${esc(s.name)}</span></button>`).join('')}</div><div class="sh"><h2>Popular services</h2><span>Tap Apply to book</span></div><div class="rl">${L.map(s=>`<div class="rc">${iconBox(s.icon)}<div class="t"><h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p></div><div class="a"><strong>${inr(s.price)}</strong><button class="btn p s" data-a="apply" data-id="${s.id}">Apply</button></div></div>`).join('')}</div>`;
}
function startSlider(){
  const n=D.banners.length;si=0;if(n<2)return;
  timer=setInterval(()=>go(si+1),5000);
}
function go(i){
  const s=document.querySelectorAll('.slide'),d=document.querySelectorAll('.dots button');if(!s.length)return;
  si=(i+s.length)%s.length;s.forEach((e,k)=>e.classList.toggle('on',k===si));d.forEach((e,k)=>e.classList.toggle('on',k===si));
}
function adminView(){
  const T=[['banners','img','Banners'],['services','grid','Services'],['apps','list','Applications'],['users','user','Users']];
  let b='';
  if(S.tab==='banners')b=`<div class="bar"><h3>Promotional banners</h3><button class="btn p" data-a="banner">${ico('plus')}Add banner</button></div><div class="tbl"><table><tr><th>Preview</th><th>Title</th><th>Subtitle</th><th></th></tr>${D.banners.map((x,i)=>`<tr><td><div class="thumb ${x.img?'':'g'+(i%3)}" ${x.img?`style="background-image:url(${x.img})"`:''}></div></td><td><b>${esc(x.title)}</b></td><td>${esc(x.sub)}</td><td><div class="acts"><button class="btn d s" data-a="delBanner" data-id="${x.id}">${ico('trash')}Delete</button></div></td></tr>`).join('')||'<tr><td colspan="4">No banners yet. Add your first one.</td></tr>'}</table></div>`;
  if(S.tab==='services')b=`<div class="bar"><h3>Services</h3><button class="btn p" data-a="svc">${ico('plus')}Add service</button></div><div class="tbl"><table><tr><th>Icon</th><th>Name</th><th>Description</th><th>Price</th><th></th></tr>${D.services.map(x=>`<tr><td>${iconBox(x.icon)}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.desc)}</td><td>${inr(x.price)}</td><td><div class="acts"><button class="btn s" data-a="svc" data-id="${x.id}">${ico('edit')}Edit</button><button class="btn d s" data-a="delSvc" data-id="${x.id}">${ico('trash')}</button></div></td></tr>`).join('')||'<tr><td colspan="5">No services yet.</td></tr>'}</table></div>`;
  if(S.tab==='apps')b=`<div class="bar"><h3>User applications</h3></div><div class="tbl"><table><tr><th>Name</th><th>Phone</th><th>Service</th><th>Date</th><th>Status</th><th></th></tr>${D.apps.slice().reverse().map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone)}</td><td>${esc(x.sname)}</td><td>${esc(x.date)}</td><td><span class="badge ${x.status}">${x.status}</span></td><td><div class="acts"><button class="btn s" data-a="editApp" data-id="${x.id}">${ico('edit')}Edit</button><button class="btn d s" data-a="delApp" data-id="${x.id}">${ico('trash')}</button></div></td></tr>`).join('')||'<tr><td colspan="6">No applications received yet.</td></tr>'}</table></div>`;
  if(S.tab==='users')b=`<div class="bar"><h3>Registered users</h3></div><div class="tbl"><table><tr><th>Name</th><th>Phone</th><th>Role</th><th></th></tr>${D.users.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone)}</td><td>${x.role}</td><td><div class="acts"><button class="btn s" data-a="editUser" data-id="${x.id}">${ico('edit')}Edit</button><button class="btn s" data-a="resetPw" data-id="${x.id}">${ico('key')}Reset password</button>${x.role==='user'?`<button class="btn d s" data-a="delUser" data-id="${x.id}">${ico('trash')}</button>`:''}</div></td></tr>`).join('')}</table></div>`;
  return `<div class="bar"><h2 class="sec" style="margin:8px 0">Admin panel</h2><button class="btn" data-a="home">View website</button></div><div class="tabs">${T.map(t=>`<button class="${S.tab===t[0]?'on':''}" data-a="tab" data-id="${t[0]}">${ico(t[1])}${t[2]}</button>`).join('')}</div>${b}`;
}
const open=(html,lg)=>{const b=$('#box');b.className='box'+(lg?' lg':'');b.innerHTML=html;$('#modal').hidden=false;const f=b.querySelector('input:not([type=radio]):not([type=file])');if(f)setTimeout(()=>f.focus(),50)};
const close=()=>{$('#modal').hidden=true};
let tt;const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2400)};
const field=(l,n,v='',t='text',x='')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x}></label>`.replace('<label>','<label>');
const btns=(ok)=>`<div class="row"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn p">${ok}</button></div>`;

function authModal(mode){
  const L=mode==='login';
  open(`<div class="sw"><button class="${L?'on':''}" data-a="auth" data-id="login">Log in</button><button class="${L?'':'on'}" data-a="auth" data-id="register">Register</button></div>
  <h3>${L?'Welcome back':'Create your account'}</h3><p class="m">${L?'Log in with your phone number and password.':'Join THC Service with your name, phone and password.'}</p>
  <form data-f="${mode}" autocomplete="on">${L?'':field('Full name','name','','text','required autocomplete="name"')}${field('Phone number','phone','','tel','required inputmode="numeric" autocomplete="tel" placeholder="10-digit number"')}${field('Password','pass','','password','required minlength="6" autocomplete="'+(L?'current':'new')+'-password"')}<div class="err" id="err"></div>${btns(L?'Log in':'Create account')}</form>`);
}
function applyModal(sid){
  const s=D.services.find(x=>x.id===sid);if(!s)return;
  open(`<h3>Apply for ${esc(s.name)}</h3><p class="m">${inr(s.price)} · Check your details and submit.</p><form data-f="apply" data-id="${sid}">${field('Name','name',S.me.name,'text','required')}${field('Phone','phone',S.me.phone,'tel','required inputmode="numeric"')}${btns('Submit request')}</form>`);
}
function svcModal(id){
  const s=D.services.find(x=>x.id===id)||{name:'',desc:'',price:'',icon:'wrench'};
  open(`<h3>${id?'Edit service':'Add service'}</h3><p class="m">Choose an icon or upload your own.</p><form data-f="svc" data-id="${id||''}">${field('Service name','name',s.name,'text','required')}<label>Description<textarea name="desc" rows="3" required>${esc(s.desc)}</textarea></label>${field('Price (₹)','price',s.price,'number','required min="0"')}<label>Icon</label><div class="picks">${ICONS.map(k=>`<label title="${k}"><input type="radio" name="ic" value="${k}" ${s.icon===k?'checked':''}><span>${ico(k)}</span></label>`).join('')}</div><label>Or upload icon image<input type="file" name="icf" accept="image/*"></label>${btns('Save service')}</form>`,1);
}
function bannerModal(){
  open(`<h3>Add banner</h3><p class="m">Banners fade in turn on the home page.</p><form data-f="banner">${field('Title','title','','text','required')}${field('Subtitle','sub','','text','required')}<label>Background image (optional)<input type="file" name="img" accept="image/*"></label>${btns('Add banner')}</form>`,1);
}
function myReq(){
  const a=D.apps.filter(x=>x.uid===S.me.id).reverse();
  open(`<h3>My requests</h3><p class="m">Track the status of your applications.</p>${a.map(x=>`<div class="pr" style="padding:10px 0;border-bottom:1px solid var(--ln)"><div><b>${esc(x.sname)}</b><div style="color:var(--mu);font-size:.85rem">${esc(x.date)}</div></div><span class="badge ${x.status}">${x.status}</span></div>`).join('')||'<div class="empty">No requests yet.</div>'}<div class="row"><button class="btn p" data-a="close">Close</button></div>`);
}

const A={
home(){S.view='home';render();scrollTo(0,0)},
svcs(){if(S.view!=='home'){S.view='home';render()}document.getElementById('services').scrollIntoView({behavior:'smooth'})},
account(){open(`<div class="ic" style="margin-bottom:14px">${ico('user')}</div><h3>${esc(S.me.name)}</h3><p class="m">${esc(S.me.phone)} · ${S.me.role==='admin'?'Administrator':'Member'}</p><div class="row"><button class="btn" data-a="close">Close</button><button class="btn d" data-a="logout">${ico('out')}Log out</button></div>`)},
admin(){S.view='admin';render()},
tab(id){S.tab=id;render()},
slide(id){go(+id);clearInterval(timer);timer=setInterval(()=>go(si+1),5000)},
close,
auth(id){authModal(id)},
logout(){close();S.me=null;S.view='home';store.set('thc_session',null);render();toast('Logged out')},
apply(id){if(!S.me){S.pending=id;authModal('login');return}applyModal(id)},
myreq:myReq,
banner:bannerModal,
svc(id){svcModal(id)},
delBanner(id){if(confirm('Delete this banner?')){D.banners=D.banners.filter(x=>x.id!==id);save('banners');render()}},
delSvc(id){if(confirm('Delete this service?')){D.services=D.services.filter(x=>x.id!==id);save('services');render()}},
delApp(id){if(confirm('Delete this application?')){D.apps=D.apps.filter(x=>x.id!==id);save('apps');render()}},
delUser(id){if(confirm('Delete this user?')){D.users=D.users.filter(x=>x.id!==id);save('users');render()}},
editApp(id){const a=D.apps.find(x=>x.id===id);
  open(`<h3>Edit application</h3><p class="m">Update the details manually.</p><form data-f="editApp" data-id="${id}">${field('Name','name',a.name,'text','required')}${field('Phone','phone',a.phone,'tel','required')}<label>Service<select name="sid">${D.services.map(s=>`<option value="${s.id}" ${s.id===a.sid?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label>Status<select name="status">${['Pending','Approved','Completed','Cancelled'].map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select></label>${btns('Save changes')}</form>`)},
editUser(id){const u=D.users.find(x=>x.id===id);
  open(`<h3>Edit user</h3><p class="m">Update name or phone number.</p><form data-f="editUser" data-id="${id}">${field('Name','name',u.name,'text','required')}${field('Phone','phone',u.phone,'tel','required')}<div class="err" id="err"></div>${btns('Save changes')}</form>`)},
resetPw(id){const u=D.users.find(x=>x.id===id);
  open(`<h3>Reset password</h3><p class="m">Set a new password for ${esc(u.name)} (${esc(u.phone)}).</p><form data-f="resetPw" data-id="${id}">${field('New password','pass','','text','required minlength="6"')}${btns('Reset password')}</form>`)}
};
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){close();return}
  const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.id)
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});

document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f)),id=f.dataset.id,k=f.dataset.f,err=m=>{const x=$('#err');if(x)x.textContent=m};
  const phone=(d.phone||'').replace(/\D/g,'');
  if('phone' in d&&!/^\d{7,15}$/.test(phone))return err('Enter a valid phone number.');
  if(k==='register'){
    if(D.users.some(u=>u.phone===phone))return err('This phone number is already registered. Log in instead.');
    const u={id:uid(),name:d.name.trim(),phone,pass:await h(d.pass),role:'user'};D.users.push(u);save('users');
    S.me=u;store.set('thc_session',u.id);close();render();toast('Account created');if(S.pending){applyModal(S.pending);S.pending=null}
  }
  if(k==='login'){
    const u=D.users.find(x=>x.phone===phone);
    if(!u||u.pass!==await h(d.pass))return err('Phone number or password is incorrect.');
    S.me=u;store.set('thc_session',u.id);close();render();toast('Welcome, '+u.name);
    if(S.pending){applyModal(S.pending);S.pending=null}
  }
  if(k==='apply'){
    const s=D.services.find(x=>x.id===id);
    D.apps.push({id:uid(),sid:id,sname:s.name,price:s.price,uid:S.me.id,name:d.name.trim(),phone,status:'Pending',date:new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})});
    save('apps');close();toast('Request submitted successfully');
  }
  if(k==='banner'){
    const file=f.img.files[0];const img=file?await fileData(file,1400,'image/jpeg'):'';
    D.banners.push({id:uid(),title:d.title.trim(),sub:d.sub.trim(),img});save('banners');close();render();toast('Banner added');
  }
  if(k==='svc'){
    const file=f.icf.files[0];let icon=d.ic||'spark';if(file){const x=await fileData(file,96,'image/png');if(x)icon=x}
    const o={name:d.name.trim(),desc:d.desc.trim(),price:+d.price,icon};
    if(id)Object.assign(D.services.find(x=>x.id===id),o);else D.services.push({id:uid(),...o});
    save('services');close();render();toast('Service saved');
  }
  if(k==='editApp'){
    const a=D.apps.find(x=>x.id===id),s=D.services.find(x=>x.id===d.sid);
    Object.assign(a,{name:d.name.trim(),phone,sid:d.sid,sname:s?s.name:a.sname,status:d.status});save('apps');close();render();toast('Application updated');
  }
  if(k==='editUser'){
    if(D.users.some(u=>u.phone===phone&&u.id!==id))return err('Another user already has this phone number.');
    Object.assign(D.users.find(x=>x.id===id),{name:d.name.trim(),phone});save('users');
    if(S.me&&S.me.id===id)S.me=D.users.find(x=>x.id===id);close();render();toast('User updated');
  }
  if(k==='resetPw'){
    D.users.find(x=>x.id===id).pass=await h(d.pass);save('users');close();toast('Password reset');
  }
});
init();
</script>
</body>
</html>
